# XcodeGen 工程定义：TSLGauge（主 App）+ TSLWidgets（Widget / Live Activity Extension）
#
# 本仓库【不提交 .xcodeproj】，由 GitHub Actions 在 macOS runner 上执行
# `xcodegen generate` 现场生成，避免 pbxproj 合并冲突，也避免 Windows 端
# 手写工程文件带来的格式风险。
#
# 本地有 Mac 时：brew install xcodegen && xcodegen generate && open TSLGauge.xcodeproj

name: TSLGauge

options:
  bundleIdPrefix: com.tsl
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: false

settings:
  base:
    SDKROOT: iphoneos
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CLANG_ENABLE_MODULES: "YES"
    GENERATE_INFOPLIST_FILE: "NO"
    # 默认哨兵值：不启用 App Group。不用空串是因为 Xcode 对空 build setting
    # 在 Info.plist 里的展开行为在不同版本有差异，哨兵可让 CI 自检确定。
    # 实际值由 scripts/build_unsigned.sh 通过 xcodebuild 命令行覆盖。
    TSL_APP_GROUP: "__NO_APP_GROUP__"
    TSL_DISPLAY_NAME: "TSL 车速"

targets:

  TSLGauge:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
      - path: Sources/Shared
    settings:
      base:
        # 直接引用手写 plist，避免 XcodeGen 各版本对 info.properties 的
        # 生成行为差异覆盖掉 TSLAppGroup / UIBackgroundModes 等键
        INFOPLIST_FILE: App/Info.plist
        # scripts/configure.py 会按 workflow 输入 bundle_id 改写下面两行
        PRODUCT_BUNDLE_IDENTIFIER: com.tsl.gauge
        PRODUCT_NAME: TSLGauge
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    dependencies:
      # XcodeGen 会自动生成 "Embed App Extensions" 阶段（PlugIns 目录）
      - target: TSLWidgets
        embed: true

  TSLWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Widget
      - path: Sources/Shared
    settings:
      base:
        INFOPLIST_FILE: Widget/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.tsl.gauge.widgets
        PRODUCT_NAME: TSLWidgets
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
        SKIP_INSTALL: "YES"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"

schemes:
  TSLGauge:
    build:
      targets:
        TSLGauge: all
        TSLWidgets: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
